# Helix 文件类型检测规则
# 参考 Vim filetype detection，补充 Helix 默认不覆盖的规则

# Bash - shebang 和 glob
[[language]]
name = "bash"
scope = "source.bash"
file-types = ["sh", "bash", "zsh", "fish", { glob = "*.bashrc" }, { glob = "*.zshrc" }, { glob = "*.bash_aliases" }, { glob = "*.bash_profile" }, { glob = "*.zshenv" }, { glob = "*.zlogin" }, { glob = "*.zlogout" }, { glob = ".bashrc" }, { glob = ".zshrc" }, { glob = ".profile" }]
shebangs = ["sh", "bash", "dash", "zsh", "fish"]

# Vim 配置
[[language]]
name = "vim"
scope = "source.vim"
file-types = ["vim", "vimrc", ".vimrc", { glob = "*.vim" }, { glob = "vimrc" }, { glob = ".vimrc" }, { glob = "init.vim" }, { glob = ".config/nvim/init.vim" }]

# Neovim Lua 配置
[[language]]
name = "lua"
scope = "source.lua"
file-types = ["lua", { glob = "*.lua" }, { glob = "init.lua" }, { glob = ".config/nvim/init.lua" }]

[[language]]
name = "tmux"
scope = "source.tmux"
file-types = ["tmux", "tmux.conf", { glob = ".tmux.conf" }, { glob = "tmux.conf" }]

